<!doctype html>
<!DOCTYPE html>

<html lang="sv">
<head><meta content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" name="viewport"/>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#315c3b" name="theme-color"/><title>Monstera Manager</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/components.css" rel="stylesheet"/>
<link href="css/responsive.css" rel="stylesheet"/>
<link id="appIcon" rel="apple-touch-icon"/>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="brandIcon">🌿</div>
    <div>
      <h1>Monstera Manager</h1>
      <p>Mitt växtregister</p>
    </div>
  </div>
</header>

<main>

<section id="home">

  <div class="stats">
    <div class="stat">
      <small>🌱 Plantor</small>
      <b id="plantCount">0</b>
    </div>

    <div class="stat">
      <small>📸 Bilder</small>
      <b id="imageCount">0</b>
    </div>
  </div>

  <div id="projectDashboard"></div>
  <div id="reminderSummary"></div>

  <h2 class="section">Mina plantor</h2>

  <div id="plants" class="list"></div>

  <button class="primary" onclick="openAddPlantSheet()">
    ➕ Lägg till planta
  </button>

</section>


<section id="detail" class="detail">

  <button class="back" onclick="goHome()">
    ← Tillbaka
  </button>

  <div id="detailContent"></div>

  <div id="statsArea"></div>

</section>

</main>

</div>


<!-- ADD PLANT -->

<div id="addPlantSheet" class="modalBg">

  <div class="modal">

    <div class="modalHead">
      <h2>🌱 Lägg till planta</h2>
      <button class="close" onclick="closeAddPlantSheet()">×</button>
    </div>

    <form id="addPlantForm" onsubmit="return MM_submitAddPlant(event)">

      <div class="field">
        <label>Kategori</label>
        <select id="mmAddCategory">
        </select>
      </div>

      <div id="mmMonsteraVariantWrap" class="field">
        <label>Monstera-variant</label>
        <select id="mmAddVariant"></select>
      </div>

      <div class="field">
        <label>Namn</label>
        <input id="mmAddName" type="text" autocomplete="off"/>
      </div>

      <div class="cuttings-box">

        <label class="cutting-toggle">
          <input id="mmAddCutting" type="checkbox"/>
          <span>Det här är en stickling</span>
        </label>

        <div id="mmMotherWrap" class="mother-wrap">

          <label class="field">
            <span>Moderplanta</span>
            <select id="mmMotherPlant"></select>
          </label>

          <div class="mother-help">
            Välj vilken planta sticklingen kommer från.
          </div>

        </div>

      </div>


      <div class="field">
        <label>Ursprungsdatum</label>
        <input id="mmAddOrigin" type="date"/>
      </div>


      <div class="field">
        <label>Inköpsdatum</label>
        <input id="mmAddPurchase" type="date"/>
      </div>


      <div id="mmCustomCategoryWrap" class="customCategory">

        <input
          id="mmCustomCategory"
          type="text"
          placeholder="Exempel: Begonior"
        />

        <div class="customCategoryHelp">
          Skriv namnet på din nya kategori.
        </div>

      </div>


      <button class="primary" type="submit">
        Lägg till planta
      </button>

    </form>

  </div>

</div>


<!-- PLANT MODAL -->

<div id="plantModal" class="modalBg">

  <div class="modal">

    <div class="modalHead">
      <h2>🌱 Planta</h2>
      <button class="close" onclick="closePlantForm()">×</button>
    </div>

    <form id="plantForm">

      <div class="field">
        <label>Namn</label>
        <input id="pName" type="text"/>
      </div>

      <div class="field">
        <label>Kategori</label>
        <select id="pCategory"></select>
      </div>

      <div id="customCategoryWrap" class="customCategory">

        <input
          id="pCustomCategory"
          type="text"
          placeholder="Egen kategori"
        />

        <div class="customCategoryHelp">
          Skriv namnet på den egna kategorin.
        </div>

      </div>

      <div class="field">
        <label>Ursprungsdatum</label>
        <input id="pOrigin" type="date"/>
      </div>

      <div class="field">
        <label>Inköpsdatum</label>
        <input id="pPurchase" type="date"/>
      </div>

      <div class="field">
        <label>Beskrivning</label>
        <textarea id="pDesc"></textarea>
      </div>

      <div class="cuttings-box">

        <label class="cutting-toggle">
          <input id="isCutting" type="checkbox"/>
          <span>Det här är en stickling</span>
        </label>

        <div id="motherWrap" class="mother-wrap">

          <label class="field">
            <span>Moderplanta</span>
            <select id="pMother"></select>
          </label>

          <div class="mother-help">
            Välj vilken planta sticklingen kommer från.
          </div>

        </div>

      </div>

      <button class="primary" type="submit">
        Spara
      </button>

    </form>

  </div>

</div>


<!-- CAMERA -->

<div id="mmCamera" class="modalBg">

  <div class="modal">

    <div class="modalHead">
      <h2>📷 Kamera</h2>
      <button class="close" onclick="closeCamera()">×</button>
    </div>

    <video
      id="mmVideo"
      autoplay
      playsinline
      style="width:100%;border-radius:18px"
    ></video>

    <button class="primary" onclick="captureCameraPhoto()">
      📸 Ta bild
    </button>

  </div>

</div>


<input
  id="backupInput"
  type="file"
  accept=".json,application/json"
  style="display:none"
/>


<script src="js/app.js"></script>
<script src="js/backup.js"></script>
<script src="js/camera.js"></script>
<script src="js/plants.js"></script>
<script src="js/ui.js"></script>
<script src="js/diagnostics.js"></script>

</body>
</html>
